# Throwaway Nextcloud + Cookbook app for local testing.
# Reachable at http://localhost:8080 from the VM and http://10.0.2.2:8080 from the emulator.
# Login: admin / admin   (wipe everything: docker compose down -v)
services:
  nextcloud:
    image: nextcloud:31-apache
    container_name: nextcloud-dev
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 10.0.2.2 127.0.0.1"
      OVERWRITEPROTOCOL: http
    volumes:
      - nextcloud-data:/var/www/html

volumes:
  nextcloud-data:
